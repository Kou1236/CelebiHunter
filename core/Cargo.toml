[package]
name = "celebihunter-core"
version = "1.0.0"
edition = "2021"

[dependencies]
binrw = { version = "0.14", default-features = false }
num_enum = { version = "0.5", default-features = false }
libc_alloc = "1.0.6"
chrono = { version = "0.4.34", default-features = false, features = ["alloc"] }

[features]
# cfg(doctest) doesn't appear to have worked for a while now, and there's a lot of confusion around it.
# This is a (hopefully temporary) workaround.
# cargo test --features test_stubs
test_stubs = []
celebi_auto = []
celebi_calibration = ["celebi_auto", "celebi_diagnostics"]
celebi_natural = ["celebi_auto"]
celebi_resolver = ["celebi_auto"]
celebi_resolver_manual = ["celebi_auto"]
celebi_diagnostics = []
reset = ["celebi_natural"]
rng = ["celebi_resolver_manual"]

[lib]
name = "celebi_hunter"
crate-type = ["staticlib"]

[profile.release]
opt-level = 1
lto = false
panic = "abort"

[profile.dev]
panic = "abort"
